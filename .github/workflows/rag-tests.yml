name: RAG component tests

# Focused, fast signal for the retrieval layer. Installs only the light
# dependencies the RAG unit tests touch (no torch / sentence-transformers /
# faiss), so this job stays quick compared to the full backend test job.

on:
  push:
  pull_request:

jobs:
  rag-components:
    name: RAG components (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install light RAG test dependencies
        working-directory: backend
        run: |
          pip install \
            numpy==1.26.4 \
            rank-bm25==0.2.2 \
            "groq>=0.9.0" \
            langchain==0.2.16 \
            pytest==8.3.3
      - name: Run RAG component tests
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_text_utils.py \
            tests/test_splitter.py \
            tests/test_prompts.py \
            tests/test_config.py \
            tests/test_context_store.py
