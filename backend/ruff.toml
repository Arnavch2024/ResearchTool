# Ruff configuration for the backend.
# Deliberately conservative: catch real defects (syntax errors, undefined
# names, unused imports/variables) without imposing a new formatting style
# on the existing codebase.

target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# app.py calls load_dotenv() before importing modules that read env vars,
# so module-level imports intentionally follow an executable statement.
"app.py" = ["E402"]
